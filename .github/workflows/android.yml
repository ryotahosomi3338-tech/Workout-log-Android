
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

    
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          for file in MainActivity.java AndroidManifest.xml index.html style.css app.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          mkdir -p app/src/main/java/jp/personal/traininglog app/src/main/assets
          cp MainActivity.java app/src/main/java/jp/personal/traininglog/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp index.html style.css app.js app/src/main/assets/
          for file in icon-192.png icon-512.png; do
            if [ -f "$file" ]; then cp "$file" app/src/main/assets/; fi
          done

          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'TrainingLog'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'jp.personal.traininglog'
            compileSdk 35
            defaultConfig {
              applicationId 'jp.personal.traininglog'
              minSdk 24
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          GRADLE

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: training-log-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
